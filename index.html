<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title data-i18n="pageTitle"></title>
  <link rel="stylesheet" href="styles.css">
  <script src="translations.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand" data-i18n="brand"></div>
      <div class="header-actions">
        <div class="language-toggle" role="group" data-i18n-aria-label="languageSelection">
          <button type="button" class="language-option is-active" data-language="en" aria-pressed="true">EN</button>
          <button type="button" class="language-option" data-language="fr" aria-pressed="false">FR</button>
        </div>
        <a href="mailto:inquiries@heronstudios.ca" class="nav-contact" data-i18n="inquire"></a>
      </div>
    </header>

    <main>
      <!-- Hero Section -->
      <section class="hero">
        <div class="hero-text">
          <span class="badge" data-i18n="badge"></span>
          <h1 data-i18n="heroTitle"></h1>
          <p class="hero-sub" data-i18n="heroDescription"></p>
          <a href="mailto:inquiries@heronstudios.ca" class="cta-button" data-i18n="partner"></a>
        </div>

        <div class="hero-visual">
          <div class="card">
            <span class="card-label" data-i18n="sourceLabel"></span>
            <p class="prose-text" data-i18n="sourceProse"></p>
          </div>
          <div class="card">
            <span class="card-label" data-i18n="adaptationLabel"></span>
            <p class="script-text"><strong data-i18n="panelLabel"></strong> <span data-i18n="panelDescription"></span></p>
          </div>
        </div>
      </section>

      <!-- Overview Section -->
      <section class="overview">
        <h2 data-i18n="overviewTitle"></h2>
        <p data-i18n="overviewDescription"></p>
      </section>

      <!-- Process Section -->
      <section class="process">
        <div class="section-title" data-i18n="processTitle"></div>
        <div class="grid-3">
          <div>
            <div class="step-num">01</div>
            <div class="step-title" data-i18n="stepOneTitle"></div>
            <div class="step-desc" data-i18n="stepOneDescription"></div>
          </div>
          <div>
            <div class="step-num">02</div>
            <div class="step-title" data-i18n="stepTwoTitle"></div>
            <div class="step-desc" data-i18n="stepTwoDescription"></div>
          </div>
          <div>
            <div class="step-num">03</div>
            <div class="step-title" data-i18n="stepThreeTitle"></div>
            <div class="step-desc" data-i18n="stepThreeDescription"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer / Contact -->
    <footer>
      <h2 data-i18n="contactTitle"></h2>
      <p data-i18n="contactDescription"></p>
      <a href="mailto:inquiries@heronstudios.ca" class="email-link">inquiries@heronstudios.ca</a>
      <div class="copyright" data-i18n="copyright"></div>
    </footer>
  </div>

</body>
</html>
